name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds with `target-cpu=native` for local runs. 
  # That is unsafe on CI: Override with a portable baseline — x86-64-v2
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  build-and-perft:
    name: Build & Perft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Verify move generation (perft)
        run: printf 'perft\nquit\n' | cargo run --release
